[project]
name = "aiagent"
version = "0.2.0"
description = "An autonomous coding agent built on Gemini function calling, with a verified patch engine, a path sandbox and a test-driven verification loop."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Abishek Arun" }]
requires-python = ">=3.11"
keywords = ["agent", "llm", "coding-agent", "gemini", "function-calling", "patch"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "google-genai>=3.0.0,<4",
    "pytest>=8.3",  # runs the projects' test suites to verify the agent's work
    "python-dotenv>=1.1.0",
    "rich>=14.0.0",
]

[project.urls]
Repository = "https://github.com/asequas/autonomous-coding-agent"

[project.scripts]
aiagent = "aiagent.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.14",
    "mypy>=1.18",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:anyio"
filterwarnings = [
    # google-genai 3.0 ships a docstring with an invalid escape sequence.
    "ignore::SyntaxWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["evals/tasks", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "evals/run_evals.py"]
